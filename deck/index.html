<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Building browser agents</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#252525; --fg:#f4f4f4; --muted:#9a9a9a; --cyan:#5ec8e8; --yellow:#dfc765; --green:#1ec98a;
        --green-tint:#234d41; --red:#e5484d; --panel:#2f2f2f; --term:#161616; --line:#444; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden; }
body { font-family:Barlow, system-ui, sans-serif; font-weight:500; }
code, pre, .mono { font-family:"JetBrains Mono", monospace; }

/* everything is laid out on a 1920x1080 stage, scaled to fit the window */
#stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:0 0; }
.slide { position:absolute; inset:0 0 96px 0; padding:64px 80px 0; box-sizing:border-box; display:flex; flex-direction:column; }
h1 { font-size:64px; font-weight:600; margin:0 0 40px; line-height:1.1; }
.lesson-tag { font:500 26px "JetBrains Mono", monospace; color:var(--green); margin-bottom:14px; }
ul.points { list-style:none; margin:0; padding:0; font-size:42px; line-height:1.3; max-width:1600px; }
ul.points li { margin:0 0 30px; padding-left:44px; position:relative; }
ul.points li::before { content:''; position:absolute; left:0; top:20px; width:16px; height:16px; border-radius:50%; background:var(--green); }
ul.points big { font-size:56px; color:var(--yellow); }
code { background:#ffffff14; padding:2px 10px; border-radius:6px; font-size:.85em; }
b { font-weight:700; }
.foot { margin-top:auto; margin-bottom:36px; font-size:30px; color:var(--muted); }

/* title */
.title { justify-content:center; }
.title h1 { font-size:96px; max-width:1300px; }
.title .sub { font-size:44px; color:var(--fg); }
.title .sub .event { font-size:32px; color:var(--muted); margin-top:18px; }
.title .repo { margin-top:70px; display:flex; gap:40px; align-items:center; font:500 30px "JetBrains Mono", monospace; color:var(--cyan); }
.qr { background:#fff; padding:14px; border-radius:10px; line-height:0; }
.qr img { width:220px; height:220px; image-rendering:pixelated; }

/* agenda */
table.agenda { border-collapse:collapse; font-size:40px; }
table.agenda td { padding:16px 40px 16px 0; border-bottom:1px solid var(--line); }
table.agenda td:first-child { font-family:"JetBrains Mono", monospace; color:var(--green); }
table.agenda td:last-child { color:var(--muted); text-align:right; }
table.agenda tr { cursor:pointer; }
table.agenda tr:hover td { color:var(--yellow); }

/* two columns: main thing left, notes right */
.cols { display:flex; gap:56px; flex:1; min-height:0; }
.cols .main { flex:1; min-width:0; display:flex; flex-direction:column; }
.side { width:500px; flex:none; list-style:none; margin:0; padding:0; font-size:31px; line-height:1.3; }
.side li { margin:0 0 26px; padding:0 0 0 22px; border-left:4px solid var(--green); }

/* mermaid */
.mermaid-box { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
.mermaid-box svg { width:100%; height:100%; max-width:none !important; }
.side.row { width:auto; display:flex; gap:40px; margin:20px 0 40px; font-size:29px; }
.side.row li { flex:1; margin:0; }

/* run */
.run .cmd { display:flex; align-items:center; gap:28px; background:var(--term); border:2px solid var(--green); border-radius:14px;
            padding:30px 36px; margin-bottom:26px; font:500 44px "JetBrains Mono", monospace; }
.run .cmd::before { content:'$'; color:var(--green); }
.run .cmd span { flex:1; overflow-wrap:anywhere; }
.run .cmd em { font-style:normal; color:var(--muted); font-family:Barlow, sans-serif; margin-left:20px; }
.run .cmd.alt { border-color:var(--line); font-size:30px; padding:18px 36px; }
.run .label { font-size:28px; color:var(--muted); margin:16px 0 14px; }
.run .note { font-size:36px; line-height:1.35; margin-top:30px; max-width:1500px; }
button.copy { font:500 22px Barlow, sans-serif; color:var(--fg); background:#ffffff18; border:0; border-radius:8px; padding:10px 18px; cursor:pointer; }
button.copy:hover { background:#ffffff30; }
button.copy.done { background:var(--green); color:#000; }

/* terminal output */
.term { flex:1; min-height:0; background:var(--term); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; border:1px solid #333; }
.term .bar { padding:12px 22px; font:500 20px "JetBrains Mono", monospace; color:var(--muted); background:#1f1f1f; display:flex; gap:10px; align-items:center; }
.term .bar i { width:13px; height:13px; border-radius:50%; background:#444; display:inline-block; }
.term .bar span { margin-left:12px; }
.term pre { flex:1; min-height:0; margin:0; padding:20px 26px; font-size:20px; line-height:1.38; white-space:pre-wrap; overflow:hidden; color:#d8d8d8; }
.term c { color:var(--cyan); } .term g { color:var(--green); } .term m { color:#7c7c7c; }
.term b { color:#fff; }

/* two-column table */
table.files { border-collapse:collapse; font-size:38px; }
table.files td { padding:14px 50px 14px 0; border-bottom:1px solid var(--line); }
table.files td:first-child { font-family:"JetBrains Mono", monospace; color:var(--cyan); font-size:34px; }

/* multi-column table: research results */
table.grid { border-collapse:collapse; font-size:30px; width:100%; }
table.grid th { text-align:left; font-weight:600; color:var(--muted); font-size:24px; padding:0 24px 14px 0; border-bottom:2px solid var(--line); }
table.grid td { padding:14px 24px 14px 0; border-bottom:1px solid var(--line); }
table.grid td:not(:first-child), table.grid th:not(:first-child) { text-align:right; font-family:"JetBrains Mono", monospace; font-size:28px; }
table.grid tr.pick td { color:var(--green); }
table.grid tr.pick td:first-child { font-weight:700; }

/* animated diagram, full slide */
.diagram { padding:0; }
.diagram iframe { border:0; width:100%; height:100%; }

/* bottom bar: where we are + the command to run, always visible */
#bar { position:absolute; left:0; right:0; bottom:0; height:96px; background:#1b1b1b; display:flex; align-items:center;
       gap:30px; padding:0 40px 0 0; box-sizing:border-box; border-top:1px solid #333; }
#bar .where { font:600 28px Barlow, sans-serif; padding-left:40px; white-space:nowrap; }
#bar .where span { color:var(--green); font-family:"JetBrains Mono", monospace; margin-right:12px; }
#bar .now { flex:1; min-width:0; display:flex; align-items:center; gap:16px; font:500 24px "JetBrains Mono", monospace; color:var(--muted); }
#bar .now code { background:none; padding:0; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#bar .count { font:500 22px "JetBrains Mono", monospace; color:#777; white-space:nowrap; }
#progress { position:absolute; left:0; right:0; bottom:96px; height:6px; display:flex; gap:3px; }
#progress div { flex:1; background:#3a3a3a; cursor:pointer; position:relative; }
#progress div i { position:absolute; inset:0; width:0; background:var(--green); }
</style>
</head>
<body>
<div id="stage"><div id="slot"></div><div id="progress"></div><div id="bar"></div></div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="slides.js"></script>
<script>
// Keys: → / space / PageDown next, ← / PageUp back, 0-6 jump to a lesson, Home start, f fullscreen, r restart a diagram.
// The URL hash is the slide (#03.2 = lesson 03, slide 2), so a reload or a shared link lands on the same slide.
const stage = document.getElementById('stage'), slot = document.getElementById('slot');
const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `scale(${s}) translate(-50%, -50%)`; };
addEventListener('resize', fit); fit();

// one flat list: intro, every lesson's slides, outro
const groups = [{ id: 'intro', title: 'Intro', slides: INTRO }, ...LESSONS, ...(typeof BONUS === 'undefined' ? [] : [BONUS]), { id: 'end', title: 'The end', slides: OUTRO }];
const flat = groups.flatMap(g => g.slides.map((s, i) => ({ ...s, group: g, n: i + 1 })));
const keyOf = s => `${s.group.id}.${s.n}`;

if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: 'dark', fontFamily: 'Barlow, sans-serif',
  themeVariables: { fontSize: '22px', primaryColor: '#2f2f2f', primaryBorderColor: '#1ec98a', primaryTextColor: '#f4f4f4',
                    lineColor: '#bdbdbd', clusterBkg: '#234d4155', clusterBorder: '#1ec98a', edgeLabelBackground: '#252525' } });

const h = (tag, attrs = {}, html = '') => { const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); e.innerHTML = html; return e; };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

function copy(text, btn) {
  const ok = () => { btn.textContent = 'copied'; btn.classList.add('done'); setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('done'); }, 1200); };
  // file:// pages may not get the clipboard API, the textarea trick works everywhere
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(ok, () => {
    const t = h('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); ok();
  });
}
const copyBtn = text => { const b = h('button', { class: 'copy' }, 'copy'); b.onclick = e => { e.stopPropagation(); copy(text, b); }; return b; };
// a '# comment' after the command is shown grey and left out of the copy (zsh would choke on it)
const cmdRow = (text, cls = 'cmd') => {
  const [cmd, note] = text.split(/\s+#\s+/), d = h('div', { class: cls });
  d.append(h('span', {}, esc(cmd) + (note ? ` <em>${esc(note)}</em>` : '')), copyBtn(cmd)); return d; };
const sideList = items => h('ul', { class: 'side' }, (items || []).map(s => `<li>${s}</li>`).join(''));
const heading = (s, text) => {
  const frag = document.createDocumentFragment();
  if (s.group.time) frag.append(h('div', { class: 'lesson-tag' }, s.group.id === 'bonus' ? esc(s.group.title) : `${s.group.id} ${esc(s.group.title)}`));
  if (text) frag.append(h('h1', {}, text));
  return frag;
};
function qr() {
  if (!window.qrcode) return '';
  const q = qrcode(0, 'M'); q.addData(REPO); q.make();
  return `<div class="qr"><img src="${q.createDataURL(8, 0)}" alt="QR code of the repo"></div>`;
}

let mermaidN = 0;
const render = {
  title(s, el) {
    el.classList.add('title');
    el.append(h('h1', {}, s.h), h('div', { class: 'sub' }, s.sub || ''));
    if (s.qr) el.append(h('div', { class: 'repo' }, `${qr()}<div>${REPO.replace('https://', '')}<br><br><span style="color:var(--muted)">then open deck/index.html</span></div>`));
  },
  points(s, el) { el.append(heading(s, s.h), h('ul', { class: 'points' }, s.items.map(i => `<li>${i}</li>`).join(''))); if (s.foot) el.append(h('div', { class: 'foot' }, s.foot)); },
  agenda(s, el) {
    el.append(h('h1', {}, 'Lessons'));
    const t = h('table', { class: 'agenda' });
    LESSONS.forEach(l => { const r = h('tr', {}, `<td>${l.id}</td><td>${esc(l.title)}</td><td>${l.time} min</td>`); r.onclick = () => goKey(`${l.id}.1`); t.append(r); });
    if (typeof BONUS !== 'undefined') { const r = h('tr', { style: 'opacity:.6' }, `<td>+</td><td>${esc(BONUS.title)}</td><td>if time</td>`); r.onclick = () => goKey('bonus.1'); t.append(r); }
    el.append(t, h('div', { class: 'foot' }, `${LESSONS.reduce((a, l) => a + l.time, 0)} min of lessons, the rest is questions and slack`));
  },
  mermaid(s, el) {
    el.append(heading(s, s.h));
    // flowcharts are wide: the diagram gets the full width, the notes go in a row underneath
    const box = h('div', { class: 'mermaid-box' }); el.append(box);
    if (s.side) { const row = sideList(s.side); row.classList.add('row'); el.append(row); }
    if (!window.mermaid) { box.innerHTML = `<pre>${esc(s.code)}</pre>`; return; }
    mermaid.render(`m${mermaidN++}`, s.code).then(({ svg }) => { box.innerHTML = svg; });
  },
  diagram(s, el) { el.classList.add('diagram'); el.append(h('iframe', { src: s.src })); },
  page(s, el) { render.diagram(s, el); },   // full screen page, no steps: → moves on
  run(s, el) {
    el.classList.add('run'); el.append(heading(s, s.h));
    s.cmds.forEach(c => el.append(cmdRow(c)));
    if (s.alt) { el.append(h('div', { class: 'label' }, 'or')); s.alt.forEach(c => el.append(cmdRow(c, 'cmd alt'))); }
    if (s.note) el.append(h('div', { class: 'note' }, s.note));
  },
  output(s, el) {
    el.append(heading(s, s.h));
    const cols = h('div', { class: 'cols' }), main = h('div', { class: 'main' });
    const term = h('div', { class: 'term' }, `<div class="bar"><i></i><i></i><i></i><span>${s.label ? esc(s.label) : '$ ' + esc(s.cmd)}</span></div>`);
    term.append(h('pre', {}, s.out)); main.append(term);
    cols.append(main); if (s.side) cols.append(sideList(s.side)); el.append(cols);
    el.style.paddingBottom = '36px';
    // long output: shrink the font until it fits the terminal, down to 15px
    requestAnimationFrame(() => { const pre = term.querySelector('pre');
      for (let px = 20; px > 15 && pre.scrollHeight > pre.clientHeight + 1; px--) pre.style.fontSize = `${px - 1}px`; });
  },
  grid(s, el) {
    el.append(heading(s, s.h));
    const t = h('table', { class: 'grid' }, `<tr>${s.head.map(c => `<th>${c}</th>`).join('')}</tr>`);
    s.rows.forEach((r, i) => t.append(h('tr', { class: (s.pick || []).includes(i) ? 'pick' : '' }, r.map(c => `<td>${c}</td>`).join(''))));
    el.append(t);
    if (s.foot) el.append(h('div', { class: 'foot' }, s.foot));
  },
  table(s, el) {
    el.append(heading(s, s.h), h('table', { class: 'files' }, s.rows.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')));
    if (s.foot) el.append(h('div', { class: 'foot' }, s.foot));
  },
};

// progress bar: one segment per group, filled up to where we are
const progress = document.getElementById('progress');
groups.forEach(g => { const d = h('div', { title: g.title }, '<i></i>'); d.onclick = () => goKey(`${g.id}.1`); progress.append(d); });

let at = -1, diagram = null;   // diagram = { frame, at, steps } while an animated diagram is on screen
function show(i, { fromEnd = false } = {}) {
  if (i < 0 || i >= flat.length) return;
  at = i; const s = flat[i];
  slot.replaceChildren();
  const el = h('div', { class: 'slide' }); slot.append(el);
  render[s.kind](s, el);
  diagram = null;
  if (s.kind === 'diagram') {
    const frame = el.querySelector('iframe');
    diagram = { frame, at: 0, steps: 1, fromEnd };
  }
  history.replaceState(null, '', `#${keyOf(s)}`);
  // bottom bar
  const g = s.group, lesson = g.id.match(/^\d/);
  const bar = document.getElementById('bar'); bar.replaceChildren();
  bar.append(h('div', { class: 'where' }, lesson ? `<span>${g.id}</span>${esc(g.title)} · ${g.time} min` : g.id === 'bonus' ? `<span>+</span>${esc(g.title)} · if time` : esc(g.title)));
  const now = h('div', { class: 'now' });
  if (g.cmd) { now.append(h('span', {}, 'run:'), h('code', {}, esc(g.cmd)), copyBtn(g.cmd)); }
  bar.append(now, h('div', { class: 'count' }, `${s.n}/${g.slides.length}`));
  groups.forEach((gg, gi) => {
    const fill = progress.children[gi].firstChild, gidx = groups.indexOf(g);
    fill.style.width = gi < gidx ? '100%' : gi > gidx ? '0' : `${100 * s.n / g.slides.length}%`;
  });
}
const goKey = k => { const i = flat.findIndex(s => keyOf(s) === k); if (i >= 0) show(i); };
const tell = cmd => diagram && diagram.frame.contentWindow.postMessage({ diagram: cmd }, '*');

function next() {
  if (diagram && diagram.at < diagram.steps - 1) return tell('next');
  show(at + 1);
}
function prev() {
  if (diagram && diagram.at > 0) return tell('prev');
  const target = at - 1;
  show(target, { fromEnd: true });
}
function key(k) {
  if (k === ' ' || k === 'ArrowRight' || k === 'PageDown' || k === 'ArrowDown') next();
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp') prev();
  else if (k === 'Home') show(0);
  else if (k === 'End') show(flat.length - 1);
  else if (k === 'r') tell('restart');
  else if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  else if (/^[0-9]$/.test(k)) goKey(`0${k}.1`);
  else return false;
  return true;
}
addEventListener('keydown', e => { if (!e.metaKey && !e.ctrlKey && !e.altKey && key(e.key)) e.preventDefault(); });
// the diagram iframe passes its keys and clicks up here, and reports which step it's on
addEventListener('message', ({ data }) => {
  if (data.deckKey) key(data.deckKey);
  if (diagram && data.diagramSteps) {
    const first = diagram.steps === 1 && diagram.at === 0;
    diagram.at = data.diagramAt; diagram.steps = data.diagramSteps;
    // coming back from the next slide: show the diagram finished, not from scratch
    if (first && diagram.fromEnd) { diagram.fromEnd = false; tell('end'); }
  }
});
// click anywhere that isn't a button or link moves on, like the diagrams
slot.addEventListener('click', e => { if (!e.target.closest('button, a, tr, code, pre')) next(); });

const fromHash = () => flat.findIndex(s => `#${keyOf(s)}` === location.hash);
addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== at) show(i); });
document.fonts.ready.then(() => { const i = fromHash(); show(i >= 0 ? i : 0); });
</script>
</body>
</html>
